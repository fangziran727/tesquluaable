<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f8f5">
  <title>访问验证</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">SYSU SPORTS</p>
    <h1 id="loginTitle">预约记录</h1>
    <form id="loginForm">
      <label for="accessPassword">访问密码</label>
      <input id="accessPassword" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">进入系统</button>
      <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
